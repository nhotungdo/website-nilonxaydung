<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Nilon Printer Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <div class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Printer Dashboard</h1>
                <p class="text-gray-500">Real-time order synchronization & automated printing</p>
            </div>
            <div class="flex items-center space-x-4">
                <div class="flex items-center px-4 py-2 bg-green-100 text-green-700 rounded-full text-sm font-medium">
                    <span class="w-2 h-2 bg-green-500 rounded-full mr-2 animate-pulse"></span>
                    API Server Online (Port 5000)
                </div>
            </div>
        </div>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium">Tổng đơn hôm nay</p>
                        <h3 id="stat-total" class="text-2xl font-bold text-gray-800">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-blue-50 flex items-center justify-center rounded-xl">
                        <i class="fas fa-shopping-cart text-blue-500 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium">Đã in thành công</p>
                        <h3 id="stat-printed" class="text-2xl font-bold text-green-600">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-green-50 flex items-center justify-center rounded-xl">
                        <i class="fas fa-print text-green-500 text-xl"></i>
                    </div>
                </div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm text-gray-500 font-medium">Đơn lỗi / Chờ xử lý</p>
                        <h3 id="stat-failed" class="text-2xl font-bold text-red-600">0</h3>
                    </div>
                    <div class="w-12 h-12 bg-red-50 flex items-center justify-center rounded-xl">
                        <i class="fas fa-exclamation-triangle text-red-500 text-xl"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Recent Orders -->
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-6 border-bottom border-gray-100 flex justify-between items-center">
                    <h3 class="font-bold text-gray-800">Đơn hàng mới nhất</h3>
                    <button onclick="refreshData()" class="text-blue-500 hover:text-blue-600 text-sm font-medium">
                        <i class="fas fa-sync-alt mr-1"></i> Làm mới
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead class="bg-gray-50 text-gray-500 text-xs uppercase font-semibold">
                            <tr>
                                <th class="px-6 py-4">Mã đơn</th>
                                <th class="px-6 py-4">Khách hàng</th>
                                <th class="px-6 py-4">Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table" class="divide-y divide-gray-100">
                            <!-- Rows will be injected here -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Logs -->
            <div class="bg-gray-900 rounded-2xl shadow-sm overflow-hidden">
                <div class="p-6 border-b border-gray-800 flex justify-between items-center">
                    <h3 class="font-bold text-white">Hệ thống Logs</h3>
                    <span class="px-2 py-1 bg-gray-800 text-gray-400 text-xs rounded uppercase font-mono">Real-time</span>
                </div>
                <div id="logs-container" class="p-6 font-mono text-sm text-gray-400 h-[400px] overflow-y-auto space-y-2">
                    <!-- Logs will be injected here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const { ipcRenderer } = require('electron');

        async function refreshData() {
            const stats = await ipcRenderer.invoke('get-stats');
            
            document.getElementById('stat-total').innerText = stats.total;
            document.getElementById('stat-printed').innerText = stats.printed;
            document.getElementById('stat-failed').innerText = stats.failed;

            const tableBody = document.getElementById('orders-table');
            tableBody.innerHTML = stats.recentOrders.map(order => `
                <tr class="hover:bg-gray-50 transition-colors">
                    <td class="px-6 py-4 font-medium text-gray-800">#${order.orderCode}</td>
                    <td class="px-6 py-4 text-gray-600">${order.customerName}</td>
                    <td class="px-6 py-4">
                        <span class="px-3 py-1 rounded-full text-xs font-medium ${
                            order.status === 'printed' ? 'bg-green-100 text-green-700' : 
                            order.status === 'failed' ? 'bg-red-100 text-red-700' : 'bg-yellow-100 text-yellow-700'
                        }">
                            ${order.status}
                        </span>
                    </td>
                </tr>
            `).join('');

            const logsContainer = document.getElementById('logs-container');
            logsContainer.innerHTML = stats.logs.map(log => `
                <div class="flex items-start">
                    <span class="text-gray-600 mr-2">[${new Date(log.createdAt).toLocaleTimeString()}]</span>
                    <span class="${log.level === 'error' ? 'text-red-400' : 'text-blue-400'} mr-2">${log.level.toUpperCase()}:</span>
                    <span>${log.message}</span>
                </div>
            `).join('');
        }

        // Listen for real-time updates
        ipcRenderer.on('new-order', (event, order) => {
            refreshData();
        });

        // Initial refresh
        refreshData();
        setInterval(refreshData, 5000);
    </script>
</body>
</html>
