<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Arial', sans-serif; padding: 20px; color: #333; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .logo { font-size: 24px; font-weight: bold; color: #1a73e8; }
        .invoice-title { font-size: 20px; margin: 10px 0; }
        .info { display: flex; justify-content: space-between; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .total { text-align: right; font-size: 18px; font-weight: bold; }
        .footer { margin-top: 30px; text-align: center; font-style: italic; color: #777; }
        .qr { text-align: center; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">NILON XÂY DỰNG</div>
        <div class="invoice-title">HÓA ĐƠN BÁN HÀNG</div>
        <div>Mã đơn: <strong>{{orderCode}}</strong></div>
    </div>

    <div class="info">
        <div>
            <strong>Khách hàng:</strong> {{customerName}}<br>
            <strong>SĐT:</strong> {{phone}}<br>
            <strong>Địa chỉ:</strong> {{address}}
        </div>
        <div style="text-align: right;">
            <strong>Ngày:</strong> {{date}}
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>Sản phẩm</th>
                <th>SL</th>
                <th>Đơn giá</th>
                <th>Thành tiền</th>
            </tr>
        </thead>
        <tbody>
            {{items}}
        </tbody>
    </table>

    <div class="total">
        Tổng cộng: {{totalAmount}}đ
    </div>

    <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://nilonxaydung.com/pay/{{orderCode}}" alt="QR Payment">
        <p>Quét mã để thanh toán</p>
    </div>

    <div class="footer">
        Cảm ơn quý khách đã tin dùng sản phẩm của chúng tôi!
    </div>
</body>
</html>
