services:
  # 🌐 Next.js 15 Website Application

  nilon-website:
    build:
      context: ./nilon-website
      dockerfile: Dockerfile
    container_name: nilon-website-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    networks:
      - nilon-network
    depends_on:
      postgres-db:
        condition: service_healthy

  # ⚙️ Nilon Invoices Backend & API Service
  nilon-invoices-api:
    build:
      context: ./nilon-invoices
      dockerfile: Dockerfile
    container_name: nilon-invoices-service
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=postgres
      - DB_USER=postgres
      - DB_PASSWORD=Donhotung2004
    networks:
      - nilon-network
    depends_on:
      postgres-db:
        condition: service_healthy

  # 🐘 Local PostgreSQL Database with auto-migrated schema
  postgres-db:
    image: postgres:16-alpine
    container_name: nilon-postgres-db
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=Donhotung2004
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./supabase-migration.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - nilon-network

networks:
  nilon-network:
    driver: bridge
    name: nilon-network

volumes:
  postgres-data:
    driver: local
